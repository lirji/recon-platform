# 叠加层: 开启 B5 Flowable 冲正审批工作流。
# 配合 compose.mysql.yml 时，该叠加层会提供 dev-infra MySQL 中独立的 recon_flowable schema，
# backend 重启不会丢失流程状态；仅配 compose.yml 时仍沿用内存 H2，便于无外部依赖验证。
#
# 用法(叠加在默认 MySQL8 部署之上):
#   docker compose -f compose.yml -f compose.mysql.yml -f compose.flowable.yml up -d --no-build --wait
services:
  backend:
    environment:
      RECON_WORKFLOW_FLOWABLE_ENABLED: "true"
