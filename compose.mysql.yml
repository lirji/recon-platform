# dev-infra MySQL 8.4 叠加层：复用共享数据库与 Kafka，不再为本项目创建重复中间件容器。
#
# 首次接入：
#   cp .env.example .env
#   # 修改 RECON_DB_PASSWORD 后执行：
#   ./bootstrap-dev-infra.sh
#
# 启动：
#   ./compose.sh -f compose.yml -f compose.mysql.yml up -d --build --remove-orphans
#
# 数据库和账号由 bootstrap-dev-infra.sh 幂等创建。跨 Compose 服务不能使用 depends_on，
# 后端依靠 Hikari/Spring Boot 启动失败与 restart: unless-stopped 处理共享服务尚未就绪的情况。
name: recon-platform

services:
  backend:
    environment:
      DB_URL: "jdbc:mysql://infra-mysql84:3306/${RECON_DB_NAME:-recon}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8"
      DB_USER: ${RECON_DB_USER:-recon}
      DB_PASSWORD: ${RECON_DB_PASSWORD:?set RECON_DB_PASSWORD in .env}
      # 连接池按 partition 池 × 3 + 余量；并与共享 MySQL max_connections 协调。
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      # Kafka 功能默认关闭；开启 ODS/outbox 时直接复用 dev-infra Kafka 3.8。
      RECON_KAFKA_BOOTSTRAP: infra-kafka38:9092
      # compose.flowable.yml 启用引擎时使用共享 MySQL 中的独立持久化 schema；未启用时这些参数不产生连接。
      RECON_WORKFLOW_FLOWABLE_JDBC_URL: "jdbc:mysql://infra-mysql84:3306/${RECON_FLOWABLE_DB_NAME:-recon_flowable}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8"
      RECON_WORKFLOW_FLOWABLE_JDBC_DRIVER: com.mysql.cj.jdbc.Driver
      RECON_WORKFLOW_FLOWABLE_JDBC_USERNAME: ${RECON_DB_USER:-recon}
      RECON_WORKFLOW_FLOWABLE_JDBC_PASSWORD: ${RECON_DB_PASSWORD:?set RECON_DB_PASSWORD in .env}
    networks:
      - default
      - dev-infra

networks:
  dev-infra:
    external: true
    name: ${DEV_INFRA_NETWORK:-dev-infra}
