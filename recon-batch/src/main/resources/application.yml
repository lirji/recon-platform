# recon-batch 组合根配置。
# 默认 H2 内存 (MySQL 兼容模式), 免 Docker 本地可跑; 生产用 DB_URL/DB_USER/DB_PASSWORD 覆盖为 MySQL8/PG。
# Flyway 在启动/测试期迁移 V1 (领域 schema) + V2 (Batch 元数据)。
server:
  # A1: Casdoor JWT (含 permissions/groups) ~9KB, 默认 8KB header 上限会让合法 Bearer 报 400 —— 放宽到 64KB.
  max-http-request-header-size: 64KB
spring:
  application:
    name: recon-batch
  datasource:
    url: ${DB_URL:jdbc:h2:mem:recon;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # M3 分桶并行: 每个 partition worker 峰值持 3 连接 (LEFT/RIGHT 两条流式游标 + chunk 事务连接),
      # 并发度 = recon.partition.pool-size (默认 4) → 需 ~12 连接; 加 JobRepository/汇总步余量, 池设 20.
      # 生产按 partition 池大小 × 3 + 余量调, 并与 DB max_connections 对齐 (DB_POOL_SIZE 覆盖).
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    enabled: true
    # V1 领域 schema 在 db/migration (MySQL8/PG/H2 通用, 无子目录); V3 match_key collation pin (遗留②) 按方言放
    # db/schema/{vendor}; V2 Batch 元数据按方言放 db/batch/{vendor}. Flyway 合并全部 location 按版本号全局排序
    # (V1→V2→V3). {vendor}=h2|mysql|postgresql: 遗留②→MySQL utf8mb4_bin / PG COLLATE "C" / H2 no-op.
    locations: classpath:db/migration,classpath:db/schema/{vendor},classpath:db/batch/{vendor}
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  # M2: Spring Batch autoconfig.
  batch:
    jdbc:
      # 元数据表由 Flyway V2 建, 关掉 Boot 的自动建表 (否则与 Flyway 撞车).
      initialize-schema: never
      # H2/MySQL 兼容: JobRepository 建执行记录用 READ_COMMITTED, 避开 H2 SERIALIZABLE 摩擦.
      isolation-level-for-create: READ_COMMITTED
    job:
      # 不在应用启动时自动跑 Job (由调度/REST/测试显式 JobLauncher 触发). M5 起接调度.
      enabled: false

# M2 记录游标批取行数 (非 MySQL); MySQL 走 fetchSize=Integer.MIN_VALUE 真流式 (隐患②, 代码内按方言判定).
recon:
  record-cursor:
    fetch-size: 1000
  # M6 数据源选择: 默认 DB 保持向后兼容；切换 csv-file 时三条文件路径必填。
  # CSV 表头使用与 DB 列一致的 id/order_no/issue_id/channel_serial_no/ccy/amount_minor/... 约定。
  m4:
    source-type: ${RECON_M4_SOURCE_TYPE:db}               # db | csv-file
    marketing-table: ${RECON_M4_MARKETING_TABLE:recon_src_marketing}
    accounting-table: ${RECON_M4_ACCOUNTING_TABLE:recon_src_accounting}
    channel-table: ${RECON_M4_CHANNEL_TABLE:recon_src_channel}
    marketing-file: ${RECON_M4_MARKETING_FILE:}
    accounting-file: ${RECON_M4_ACCOUNTING_FILE:}
    channel-file: ${RECON_M4_CHANNEL_FILE:}
    csv:
      charset: ${RECON_M4_CSV_CHARSET:UTF-8}
      delimiter: ${RECON_M4_CSV_DELIMITER:,}
  # B2 Drools 判差策略层. 默认关 (不付启动开销). 开启后 evaluator-type=DROOLS 的段经 recon-rules-drools 判差:
  # 先跑 core 分类器得候选, 再由 DRL 规则 suppress/改判 (默认规则集 ≡ EXACT/TOLERANCE, parity 锁定). extra-classpath
  # 可叠加一份 ops 自定义 DRL (classpath 资源). DRL 编译失败 → 启动 fail-fast; 未启用却配 DROOLS → 装配 fail-fast.
  rules:
    drools:
      enabled: ${RECON_RULES_DROOLS_ENABLED:false}        # true 时激活 Drools 判差器 (@ConditionalOnProperty)
      extra-classpath: ${RECON_RULES_DROOLS_EXTRA:}        # 可选: 追加自定义 DRL 的 classpath 路径 (如 rules/ops.drl)
  # M4 营销三方场景两段判差规则 (修复 D). 默认 EXACT (阈值忽略, 等价精确比较); 改 TOLERANCE 并配阈值即让该段
  # 运行态经 EvaluatorResolver 命中 ToleranceEvaluator —— |expected-actual| 落在绝对(minor)或比例(bps=万分之一)
  # 阈值内 (取更宽者) 的 AMOUNT_MISMATCH 视为匹配不产差. 阈值 <=0 表示该阈值关闭. DROOLS 需先 enabled 否则 fail-fast.
  scenario:
    mkt:
      seg1:
        evaluator-type: ${RECON_MKT_SEG1_EVALUATOR:EXACT}     # EXACT | TOLERANCE | DROOLS
        abs-tolerance-minor: ${RECON_MKT_SEG1_ABS_TOL:0}      # 绝对金额容差 (最小货币单位/分)
        ratio-tolerance-bps: ${RECON_MKT_SEG1_RATIO_BPS:0}    # 比例容差 (bps, 以权威侧 expected 为基数)
      seg2:
        evaluator-type: ${RECON_MKT_SEG2_EVALUATOR:EXACT}
        abs-tolerance-minor: ${RECON_MKT_SEG2_ABS_TOL:0}
        ratio-tolerance-bps: ${RECON_MKT_SEG2_RATIO_BPS:0}
  rerun:
    batch-limit: 10000
  # M5 REST/scheduler 发起 Run 默认参数 (窗口/cutoff 由账期派生, 见 ReconLaunchService).
  launch:
    bucket-count: ${RECON_LAUNCH_BUCKET_COUNT:64}          # 默认分桶数 (A8: N=64)
    scenario-code: ${RECON_LAUNCH_SCENARIO:MARKETING_3WAY} # MVP 单场景映射；拒绝错场景套用错误 Job
    default-job: ${RECON_LAUNCH_DEFAULT_JOB:marketingThreeWayJob}
  # M5 告警中继: outbox 投递上限 (超过则视为死信不再补投).
  alert:
    max-attempt: ${RECON_ALERT_MAX_ATTEMPT:5}
    # A2 生产级投递: webhook.url 非空则 WebhookAlertDispatcher 作 @Primary 覆盖 LoggingAlertDispatcher (向该 URL POST
    # JSON 信封, 适配钉钉/飞书/Slack 机器人或 HTTP 告警网关); 为空(默认)则仍用日志兜底, 不发外部请求. 密钥经
    # header-name/header-value 注入请求头(环境变量提供, 不落配置文件).
    webhook:
      url: ${RECON_ALERT_WEBHOOK_URL:}
      connect-timeout-ms: ${RECON_ALERT_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${RECON_ALERT_WEBHOOK_READ_TIMEOUT_MS:5000}
      header-name: ${RECON_ALERT_WEBHOOK_HEADER_NAME:}
      header-value: ${RECON_ALERT_WEBHOOK_HEADER_VALUE:}
  # A1 认证鉴权 (对齐 risk-platform 范式): recon-batch 作 OAuth2 Resource Server, 校验 auth-platform(Casdoor) 签发的 JWT.
  #  - 仅 secure profile (SPRING_PROFILES_ACTIVE=secure) 生效 CasdoorSecurityConfig: JWKS 验签 + issuer + audience allowlist
  #    + owner(组织) + 非空 sub; 授权按 permissions 判 (recon.read/dispose/launch).
  #  - 本地/dev/测试默认 profile 走 DevSecurityConfig permitAll (免 Casdoor, 本地可跑绿; operator 回退请求体).
  #  - 生产需在 Casdoor 侧: role viewer/operator/admin 展开为 recon.read/dispose/launch 权限; 前端 redirect_uri=<console>/auth/callback.
  auth:
    issuer: ${RECON_AUTH_ISSUER:http://localhost:8000}
    jwk-set-uri: ${RECON_AUTH_JWK_SET_URI:http://localhost:8000/.well-known/jwks}
    organization: ${RECON_AUTH_ORG:recon-platform}
    audiences: ${RECON_AUTH_AUDIENCES:}          # 逗号分隔的 client_id allowlist (如 <base>-org-recon-platform)
    operator-claim: ${RECON_AUTH_OPERATOR_CLAIM:preferred_username}
  # M5 定时调度: 默认关 (测试友好, 不加载即无后台触发). 生产开启并配 cron/间隔.
  scheduler:
    enabled: ${RECON_SCHEDULER_ENABLED:false}
    scenario-code: ${RECON_SCHEDULER_SCENARIO:MARKETING_3WAY}
    launch-cron: ${RECON_SCHEDULER_LAUNCH_CRON:-}           # "-" = 禁用定时发起; 配 cron 表达式开启
    alert-relay-delay-ms: ${RECON_SCHEDULER_ALERT_RELAY_DELAY_MS:60000}
    alert-relay-initial-ms: ${RECON_SCHEDULER_ALERT_RELAY_INITIAL_MS:60000}
  # M3 matchEvaluate worker 每 chunk 组数 (#7: 可调小以测多 chunk 跨界 + cumulative partial 覆盖正确性).
  match:
    chunk-size: ${RECON_MATCH_CHUNK_SIZE:100}
  # M3 分桶并行 (设计 §11 M3).
  partition:
    # matchEvaluateStep 有界线程池并发度 (partition worker 并行数). 与 hikari.maximum-pool-size 权衡:
    # 每 worker 峰值 3 连接, 故 pool-size × 3 + 余量 <= 连接池上限. 生产按机器核数/DB 承载调.
    pool-size: ${RECON_PARTITION_POOL_SIZE:4}
  # M3 数据倾斜 (设计 §6): 检测始终开; 二级 sub-bucket 为可选兜底, 默认关.
  skew:
    # 单 bucket 行数 > 均值 × factor 且 >= min-rows 记为热点 (A8: 5×). 仅告警/触发 sub-bucket, 不改判差结果.
    factor: ${RECON_SKEW_FACTOR:5.0}
    min-rows: ${RECON_SKEW_MIN_ROWS:1000}
    sub-bucket:
      # 开启后热点 bucket 拆成 fanout 个子分区并行 (按 match_key 二级散列, 保 join 对齐 + 守恒不重漏). 默认关.
      # #4 取舍诚实标注: 每个子分区仍<b>扫描整个热桶</b>再在内存按 subIndex 过滤 → 该桶数据被重复扫描 fanout 遍
      # (用 IO 放大换判差并行度). 仅当热桶瓶颈在判差 CPU 而非 IO 时划算; 无法把 subIndex 过滤下推 DB
      # (依赖 Java hashCode+avalanche, 无可移植 SQL 等价). 故默认关, 作显式 opt-in 兜底; 开启代价见 BucketPartitioner 告警日志.
      enabled: ${RECON_SKEW_SUBBUCKET_ENABLED:false}
      fanout: ${RECON_SKEW_SUBBUCKET_FANOUT:8}

# A4 可观测性: actuator 端点 + liveness/readiness 探针 + Micrometer→Prometheus 计量.
#  - health/info 在 secure profile 由 CasdoorSecurityConfig permitAll (供探针无凭证访问, 不泄露细节);
#    metrics/prometheus 落在 anyRequest().authenticated() —— 采集器需带 Bearer 或在受控内网经网关限制.
#  - readiness 分组 = readinessState + db(数据源健康): 未就绪(如 DB 未连上/迁移未完成)时不进流量.
#  - Spring Batch 5 在 MeterRegistry 存在时自动产 spring.batch.job/step 计量(含 status=FAILED); 另见
#    ReconJobMetricsListener 的 recon.job.failures / recon.job.duration 自定义计量(批作业失败告警的计量侧).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:recon-batch}
  prometheus:
    metrics:
      export:
        enabled: true
