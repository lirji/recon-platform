name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: ./mvnw -B -q clean package

      - name: MySQL and PostgreSQL dialect tests
        run: ./mvnw -B -q -pl recon-batch -am -Dtest=CollationRealDbIT -Dsurefire.failIfNoSpecifiedTests=false test
